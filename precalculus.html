f;color:#586473}.library form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.library input,.library select{border:1px solid #c9bda8;background:#fffaf0;padding:13px}.library form input:first-child{grid-column:1/-1}.library form button{grid-column:1/-1;padding:14px}.saved-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:35px}.saved{background:#fffaf0;padding:18px;position:relative}.saved span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#7d7468}.saved a{display:block;color:var(--ink);font:17px Georgia,serif;margin-top:9px;text-decoration:none}.saved button{position:absolute;right:8px;top:8px;border:0;background:none;font-size:20px;cursor:pointer}.empty{margin-top:30px;border:1px dashed #b9aa91;padding:25px;text-align:center;color:#7b7163;font:14px Georgia,serif}footer{background:#101b29;color:white;padding:30px 5vw;display:flex;align-items:center;justify-content:space-between}footer p,footer a{font-size:11px;color:#aeb8c2;text-decoration:none}@media(max-width:900px){.topbar nav,.status{display:none}.hero{grid-template-columns:1fr;padding-top:45px}.formula-card{min-height:300px}.study{grid-template-columns:1fr;padding:35px 16px}.side{position:static;padding:0 0 25px;display:flex;gap:7px;overflow:auto}.side label,.side input,.side-label,.ap-link{display:none}.side button{min-width:max-content;border:1px solid var(--line);padding:10px}.lesson-head,.concept,.problem-types,.practice,.resources{padding:30px 24px}.type-grid,.resource-grid,.ap-check,.library-head{grid-template-columns:1fr}.saved-grid{grid-template-columns:1fr 1fr}.module-strip{overflow:auto}.module-strip span{white-space:nowrap}.next{padding:22px 24px}.next span{display:none}}@media(max-width:540px){.hero-actions,.section-title,footer{align-items:flex-start;flex-direction:column}.hero{padding-left:20px;padding-right:20px}.formula-card{padding:30px}.hero h1{font-size:48px}.answer-line{display:grid}.answer-line button{padding:12px}.saved-grid{gri   <div id="ap-algebra-lab-root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
const { useEffect, useMemo, useState } = React;

const topics = [
  {
    id: "factoring", number: "01", title: "Factoring mastery", eyebrow: "Rewrite as a product", color: "coral",
    concept: "Factoring reverses multiplication. First look for a greatest common factor, then recognize a trinomial or a special pattern. Keep factoring until every factor is irreducible over the integers.",
    key: "GCF first · a²−b²=(a−b)(a+b) · a³±b³ patterns",
    types: [
      { name: "Greatest common factor", example: "15x³ − 25x² = 5x²(3x − 5)" },
      { name: "Trinomials", example: "6x² + 11x + 3 = (3x + 1)(2x + 3)" },
      { name: "Difference of squares", example: "9x² − 16 = (3x − 4)(3x + 4)" },
      { name: "Sum / difference of cubes", example: "x³ + 27 = (x + 3)(x² − 3x + 9)" },
      { name: "Mixed / repeated", example: "2x³ − 18x = 2x(x − 3)(x + 3)" },
    ],
    problems: [
      { q: "Factor completely: 12x³ − 27x", answer: "3x(2x-3)(2x+3)", hint: "Take out 3x, then use difference of squares." },
      { q: "Factor completely: 6x² + 13x + 6", answer: "(3x+2)(2x+3)", hint: "Find two numbers with product 36 and sum 13." },
      { q: "Factor completely: 8x³ + 125", answer: "(2x+5)(4x²-10x+25)", hint: "This is a sum of cubes." },
    ],
    resources: [
      { label: "Khan Academy: factoring", url: "https://www.khanacademy.org/math/algebra/x2f8bb11595b61c86:quadratics-multiplying-factoring", kind: "Course" },
      { label: "Math Antics — Factoring", url: "https://www.youtube.com/watch?v=0NvLtTwnUHs", kind: "Video" },
      { label: "Paul’s Notes: factoring polynomials", url: "https://tutorial.math.lamar.edu/Classes/Alg/Factoring.aspx", kind: "Guide" },
    ],
  },
  {
    id: "rational", number: "02", title: "Rational expressions", eyebrow: "Factor before you cancel", color: "blue",
    concept: "A rational expression is a quotient of polynomials. Restrictions come from the original denominator. You may cancel factors—not terms—and a canceled denominator factor creates a hole, not a restored domain value.",
    key: "Restrictions first · factor · cancel factors · LCD for ±",
    types: [
      { name: "Simplify + restrictions", example: "(x²−9)/(x²+x−6) → (x−3)/(x−2), x≠−3,2" },
      { name: "Multiply", example: "Factor every numerator and denominator before multiplying." },
      { name: "Divide", example: "Multiply by the reciprocal; add restrictions from the divisor." },
      { name: "Add / subtract", example: "Use the least common denominator, combine, then factor." },
      { name: "Complex fractions", example: "Clear small denominators using their LCD." },
    ],
    problems: [
      { q: "Simplify and state restrictions: (x²−16)/(x²−x−20)", answer: "(x-4)/(x-5), x≠-4,5", hint: "Factor: (x−4)(x+4) and (x−5)(x+4). Your simplified result should not still contain x+4." },
      { q: "Compute: 2/x + 3/(x+1)", answer: "(5x+2)/(x(x+1))", hint: "The LCD is x(x+1)." },
      { q: "For (x²−9)/(x²−x−6), identify the hole and vertical asymptote", answer: "hole (-2,-5/4); vertical asymptote x=3", hint: "Factor, cancel x+2, then substitute −2 into the simplified expression." },
    ],
    resources: [
      { label: "OpenStax: rational expressions", url: "https://openstax.org/books/algebra-and-trigonometry-2e/pages/1-6-rational-expressions", kind: "Textbook" },
      { label: "Khan Academy: rational expressions", url: "https://www.khanacademy.org/math/algebra2/x2ec2f6f830c9fb89:rational", kind: "Practice" },
      { label: "Vertical asymptotes — worked video", url: "https://www.youtube.com/watch?v=DAwUVqq5vC0", kind: "Video" },
    ],
  },
  {
    id: "exponents", number: "03", title: "Exponent rules", eyebrow: "Track the base and operation", color: "gold",
    concept: "Exponent rules are consequences of repeated multiplication. Combine exponents only when the bases and operations permit it. A negative exponent means reciprocal; a rational exponent means a root and a power.",
    key: "Product: add · quotient: subtract · power: multiply · negative: reciprocal",
    types: [
      { name: "Product / quotient", example: "x³x⁵=x⁸; x⁷/x³=x⁴" },
      { name: "Power of a power", example: "(x³)⁴=x¹²" },
      { name: "Zero + negative", example: "x⁰=1; x⁻²=1/x²" },
      { name: "Rational exponents", example: "x³ᐟ² = √(x³) = x√x (for x≥0)" },
      { name: "Multi-rule simplification", example: "Apply grouping powers before multiplication or division." },
    ],
    problems: [
      { q: "Simplify with positive exponents: (3x⁻²y³)²/(9y)", answer: "y⁵/x⁴", hint: "Square first: 9x⁻⁴y⁶, then divide." },
      { q: "Evaluate: 64^(2/3)", answer: "16", hint: "Take the cube root first, then square." },
      { q: "Rewrite using radicals: x^(5/2)", answer: "x²√x", hint: "5/2 = 2 + 1/2." },
    ],
    resources: [
      { label: "Khan Academy: exponent properties", url: "https://www.khanacademy.org/math/algebra/x2f8bb11595b61c86:exponents-radicals", kind: "Course" },
      { label: "Negative & fractional exponents", url: "https://www.youtube.com/watch?v=Zt2fdy3zrZU", kind: "Video" },
      { label: "Art of Problem Solving: negative exponents", url: "https://www.youtube.com/watch?v=LhjTj5DR7I8", kind: "Video" },
    ],
  },
  {
    id: "equations", number: "04", title: "Solving equations", eyebrow: "Solve, then check", color: "violet",
    concept: "Solving preserves equivalence while isolating the variable. Choose a method that matches the equation’s structure. Clearing denominators or squaring can introduce invalid answers, so rational and radical equations must be checked in the original equation.",
    key: "Classify · choose a method · solve · reject prohibited or extraneous values",
    types: [
      { name: "Linear", example: "Variables on one or both sides; fractions; identity or contradiction." },
      { name: "Quadratic: factoring", example: "x²−7x+12=0 → x=3,4" },
      { name: "Quadratic: other methods", example: "Square roots, completing square, formula, graph intersections." },
      { name: "Rational equations", example: "List restrictions, multiply by LCD, solve, check." },
      { name: "Radical equations", example: "Isolate radical, raise powers, solve, check for extraneous roots." },
    ],
    problems: [
      { q: "Solve: 3(2x−1)=4x+7", answer: "5", hint: "Distribute, collect x terms, then constants." },
      { q: "Solve: x²−6x−7=0", answer: "-1, 7", hint: "Find factors with product −7 and sum −6." },
      { q: "Solve: √(x+5)=x−1", answer: "4", hint: "Require x≥1, square, solve the quadratic, then check both candidates." },
    ],
    resources: [
      { label: "Paul’s Notes: solving equations", url: "https://tutorial.math.lamar.edu/Classes/Alg/SolveEquations.aspx", kind: "Guide" },
      { label: "Khan Academy: quadratic equations", url: "https://www.khanacademy.org/math/algebra/x2f8bb11595b61c86:quadratic-functions-equations", kind: "Practice" },
      { label: "Quadratic equations by factoring", url: "https://www.youtube.com/watch?v=g6RnAY_VkMs", kind: "Video" },
    ],
  },
  {
    id: "inequalities", number: "05", title: "Inequalities & intervals", eyebrow: "Describe an entire solution set", color: "green",
    concept: "An inequality usually has an interval of solutions. Critical numbers divide the number line into regions. For polynomial and rational inequalities, determine the sign on each region and include or exclude endpoints carefully.",
    key: "Flip when × or ÷ by a negative · denominator zeros never included",
    types: [
      { name: "Linear / compound", example: "−2<3x+1≤10 → −1<x≤3 → (−1,3]" },
      { name: "Polynomial", example: "Factor, mark zeros, use a sign chart." },
      { name: "Rational", example: "Mark numerator zeros and denominator exclusions." },
      { name: "Absolute value", example: "|u|<a gives AND; |u|>a gives OR (a>0)." },
      { name: "Interval notation", example: "Use brackets for included finite endpoints; never for ±∞." },
    ],
    problems: [
      { q: "Solve in interval notation: (x−2)(x+5)>0", answer: "(-∞,-5)∪(2,∞)", hint: "The product is positive when the factors have the same sign." },
      { q: "Solve: (x−3)/(x+2)≤0", answer: "(-2,3]", hint: "−2 is excluded; 3 can be included." },
      { q: "Solve: |2x+1|≥7", answer: "(-∞,-4]∪[3,∞)", hint: "Write 2x+1≤−7 OR 2x+1≥7." },
    ],
    resources: [
      { label: "Paul’s Notes: inequalities", url: "https://tutorial.math.lamar.edu/Classes/Alg/SolveInequalities.aspx", kind: "Guide" },
      { label: "Khan Academy: inequalities", url: "https://www.khanacademy.org/math/algebra/x2f8bb11595b61c86:solve-equations-inequalities", kind: "Practice" },
      { label: "Desmos graphing calculator", url: "https://www.desmos.com/calculator", kind: "Tool" },
    ],
  },
  {
    id: "ap-connection", number: "06", title: "AP connection lab", eyebrow: "Combine algebra with function analysis", color: "navy",
    concept: "AP Precalculus questions combine representations and ask what algebra means for a function. Factoring reveals zeros, holes, and asymptotes; equivalent expressions support analysis; difference quotients model average rate of change.",
    key: "Show work · preserve restrictions · interpret every algebraic result",
    types: [
      { name: "Equivalent forms", example: "Choose the form that best reveals zeros, end behavior, or discontinuities." },
      { name: "Rational-function analysis", example: "Restrictions → holes → asymptotes → intercepts → signs." },
      { name: "Difference quotients", example: "[f(x+h)−f(x)]/h; factor and cancel h, h≠0." },
      { name: "FRQ justification", example: "State what a computed value means in context, with units." },
      { name: "Multiple representations", example: "Connect formula, graph, table, and verbal description." },
    ],
    problems: [
      { q: "For f(x)=x²−3x, simplify [f(x+h)−f(x)]/h", answer: "2x+h-3", hint: "Expand (x+h)²−3(x+h), subtract f(x), factor out h." },
      { q: "For (x−1)(x+4)/(x−1)(x−2), classify x=1 and x=2", answer: "x=1 hole; x=2 vertical asymptote", hint: "Canceled denominator factor → hole; remaining denominator factor → asymptote." },
      { q: "A function changes from 14 to 29 on [2,7]. Find average rate of change", answer: "3", hint: "(29−14)/(7−2)." },
    ],
    resources: [
      { label: "FlippedMath AP Precalculus", url: "https://precalculus.flippedmath.com/ap-precalc.html", kind: "Course" },
      { label: "College Board released FRQs", url: "https://apcentral.collegeboard.org/courses/ap-precalculus/exam/past-exam-questions", kind: "Official" },
      { label: "Average rate of change video", url: "https://www.youtube.com/watch?v=lQRiw264bnI", kind: "Video" },
    ],
  },
];

const typeLessons = {"factoring:0":{"summary":"A greatest common factor is the largest numerical factor and variable power shared by every term. Taking it out first makes every later factoring step easier.","steps":["Find the GCF of the coefficients.","For each variable, use the smallest exponent appearing in every term.","Factor the GCF outside parentheses.","Check by distributing the GCF back through the parentheses."],"mistakes":["Leaving part of the common factor inside.","Using the largest exponent instead of the smallest shared exponent.","Stopping before factoring the expression inside the parentheses again."],"examples":[{"q":"Factor 18x³y² − 30x²y³","a":"6x²y²(3x − 5y)"},{"q":"Factor 14a⁴b + 21a²b³","a":"7a²b(2a² + 3b²)"}],"practice":[{"q":"Factor 24x⁴ − 36x³","a":"12x³(2x − 3)"},{"q":"Factor 15m³n² + 25m²n⁴","a":"5m²n²(3m + 5n²)"},{"q":"Factor 42a⁵b − 56a³b²","a":"14a³b(3a² − 4b)"},{"q":"Factor −18x² + 30x","a":"−6x(3x − 5)"},{"q":"Factor 12p⁴q² + 8p³q³ − 20p²q","a":"4p²q(3p²q + 2pq² − 5)"}]},"factoring:1":{"summary":"Factoring a trinomial rewrites ax²+bx+c as two binomials. The middle terms created by multiplication must add to b while the outer product matches ac.","steps":["Multiply a·c.","Find two numbers whose product is ac and whose sum is b.","Split the middle term using those numbers.","Factor by grouping, then verify by multiplying."],"mistakes":["Choosing numbers with the right product but the wrong sum.","Losing a negative sign when c is negative.","Assuming every trinomial factors over the integers."],"examples":[{"q":"Factor 6x² + 11x + 3","a":"(3x + 1)(2x + 3)"},{"q":"Factor 8x² − 2x − 3","a":"(4x − 3)(2x + 1)"}],"practice":[{"q":"Factor x² + 9x + 20","a":"(x + 4)(x + 5)"},{"q":"Factor 3x² + 14x + 8","a":"(3x + 2)(x + 4)"},{"q":"Factor 5x² − 13x − 6","a":"(5x + 2)(x − 3)"},{"q":"Factor 6x² − x − 2","a":"(3x − 2)(2x + 1)"},{"q":"Factor 12x² + 11x − 5","a":"(3x − 1)(4x + 5)"}]},"factoring:2":{"summary":"A difference of squares has the form A²−B² and factors into conjugates (A−B)(A+B). Both terms must be perfect squares and the operation must be subtraction.","steps":["Confirm there are exactly two terms separated by subtraction.","Write each term as a square.","Apply A²−B²=(A−B)(A+B).","Factor either binomial further when possible."],"mistakes":["Trying to use the pattern on a sum of squares.","Forgetting to continue factoring repeated differences of squares.","Taking an incorrect square root of a coefficient or variable power."],"examples":[{"q":"Factor 25x² − 49","a":"(5x − 7)(5x + 7)"},{"q":"Factor x⁴ − 81","a":"(x − 3)(x + 3)(x² + 9)"}],"practice":[{"q":"Factor 16x² − 121","a":"(4x − 11)(4x + 11)"},{"q":"Factor 9a⁴ − 25b²","a":"(3a² − 5b)(3a² + 5b)"},{"q":"Factor 81x⁴ − 1","a":"(3x − 1)(3x + 1)(9x² + 1)"},{"q":"Factor 4m⁶ − 49n⁴","a":"(2m³ − 7n²)(2m³ + 7n²)"},{"q":"Factor x⁸ − 16","a":"(x² − 2)(x² + 2)(x⁴ + 4)"}]},"factoring:3":{"summary":"Sums and differences of cubes use two related patterns. The binomial sign is copied, while the middle sign in the quadratic factor is opposite.","steps":["Recognize A³+B³ or A³−B³.","Take the cube root of each term.","Use A³+B³=(A+B)(A²−AB+B²) or A³−B³=(A−B)(A²+AB+B²).","Check the signs and multiply if uncertain."],"mistakes":["Using a difference-of-squares pattern.","Putting the wrong sign on the middle term of the quadratic factor.","Forgetting to factor out a GCF first."],"examples":[{"q":"Factor x³ + 64","a":"(x + 4)(x² − 4x + 16)"},{"q":"Factor 27a³ − 8b³","a":"(3a − 2b)(9a² + 6ab + 4b²)"}],"practice":[{"q":"Factor x³ − 125","a":"(x − 5)(x² + 5x + 25)"},{"q":"Factor 8x³ + 27","a":"(2x + 3)(4x² − 6x + 9)"},{"q":"Factor 64a³ − b³","a":"(4a − b)(16a² + 4ab + b²)"},{"q":"Factor 54x³ + 2","a":"2(3x + 1)(9x² − 3x + 1)"},{"q":"Factor 16m⁶ − 250n³","a":"2(2m² − 5n)(4m⁴ + 10m²n + 25n²)"}]},"factoring:4":{"summary":"Mixed factoring problems require more than one pattern. Work from the outside inward: GCF first, then classify what remains, and repeat until every factor is irreducible.","steps":["Take out the GCF.","Count terms and identify the next pattern.","Factor the remaining polynomial.","Inspect every factor to see whether it factors again."],"mistakes":["Stopping after the first step.","Missing a hidden difference of squares inside a factor.","Expanding instead of preserving a useful factored form."],"examples":[{"q":"Factor 2x³ − 18x","a":"2x(x − 3)(x + 3)"},{"q":"Factor 3x⁴ − 48","a":"3(x − 2)(x + 2)(x² + 4)"}],"practice":[{"q":"Factor 5x³ + 20x² + 20x","a":"5x(x + 2)²"},{"q":"Factor 4x⁵ − 64x","a":"4x(x − 2)(x + 2)(x² + 4)"},{"q":"Factor 6x⁴ − 54x²","a":"6x²(x − 3)(x + 3)"},{"q":"Factor 2x⁴ + 14x³ + 24x²","a":"2x²(x + 3)(x + 4)"},{"q":"Factor 9x⁶ − 144x²","a":"9x²(x² − 4)(x² + 4) = 9x²(x − 2)(x + 2)(x² + 4)"}]},"rational:0":{"summary":"Simplifying rational expressions means factoring and canceling common factors, not terms. Restrictions always come from the original denominator before anything is canceled.","steps":["Set each original denominator factor unequal to zero.","Factor numerator and denominator completely.","Cancel only common multiplicative factors.","State the simplified expression together with every original restriction."],"mistakes":["Canceling terms across addition or subtraction.","Forgetting a restriction after its factor cancels.","Finding restrictions from the simplified denominator only."],"examples":[{"q":"Simplify (x²−9)/(x²+x−6)","a":"(x−3)/(x−2), x≠−3,2"},{"q":"Simplify (4x²−16)/(2x²+8x+8)","a":"2(x−2)/(x+2), x≠−2"}],"practice":[{"q":"Simplify (x²−25)/(x²−7x+10)","a":"(x+5)/(x−2), x≠2,5"},{"q":"Simplify (3x²−12x)/(6x²−24)","a":"x/(2(x+2)), x≠−2,2"},{"q":"Simplify (x²+5x+6)/(x²+4x+3)","a":"(x+2)/(x+1), x≠−1,−3"},{"q":"Simplify (9x²−1)/(3x²+8x−3)","a":"(3x+1)/(x+3), x≠1/3,−3"},{"q":"Simplify (2x²−18)/(x²−6x+9)","a":"2(x+3)/(x−3), x≠3"}]},"rational:1":{"summary":"To multiply rational expressions, factor every numerator and denominator first. Cancel common factors before multiplying so the arithmetic stays small.","steps":["State restrictions from all original denominators.","Factor every polynomial.","Cancel common factors across the product.","Multiply the remaining factors."],"mistakes":["Multiplying before factoring.","Canceling factors that are not identical.","Ignoring restrictions from a factor that cancels."],"examples":[{"q":"Multiply (x²−9)/(x²−4) · (x+2)/(x−3)","a":"(x+3)/(x−2), x≠−2,2,3"},{"q":"Multiply (2x)/(x²−1) · (x+1)/(6x²)","a":"1/(3x(x−1)), x≠−1,0,1"}],"practice":[{"q":"(x²−16)/(x²−9) · (x+3)/(x−4)","a":"(x+4)/(x−3), x≠−3,3,4"},{"q":"(3x²)/(x²−25) · (x−5)/(9x)","a":"x/(3(x+5)), x≠−5,0,5"},{"q":"(x²+x)/(x²−4x+3) · (x−3)/(x+1)","a":"x/(x−1), x≠−1,1,3"},{"q":"(4x²−1)/(2x²+5x+2) · (2x+1)/(2x−1)","a":"(2x+1)/(x+2), x≠−2,−1/2,1/2"},{"q":"(x³−x)/(x²−4) · (x+2)/(x²+x)","a":"(x−1)/(x), x≠−2,0,2,−1"}]},"rational:2":{"summary":"Dividing rational expressions means multiplying by the reciprocal of the divisor. The divisor itself cannot equal zero, so its numerator creates additional restrictions.","steps":["Record restrictions from all denominators.","Also require the divisor to be nonzero.","Flip the divisor and change division to multiplication.","Factor, cancel, and multiply."],"mistakes":["Flipping the first fraction instead of the divisor.","Forgetting restrictions from the divisor’s numerator.","Canceling before rewriting as multiplication."],"examples":[{"q":"(x²−9)/(x²−4) ÷ (x−3)/(x+2)","a":"(x+3)/(x−2), x≠−2,2,3"},{"q":"(2x)/(x²−1) ÷ (4x²)/(x+1)","a":"1/(2x(x−1)), x≠−1,0,1"}],"practice":[{"q":"(x²−25)/(x²−4) ÷ (x−5)/(x+2)","a":"(x+5)/(x−2), x≠−2,2,5"},{"q":"(3x)/(x²−9) ÷ (6x²)/(x+3)","a":"1/(2x(x−3)), x≠−3,0,3"},{"q":"(x²−x)/(x²+3x+2) ÷ (x−1)/(x+1)","a":"x/(x+2), x≠−2,−1,1"},{"q":"(4x²−9)/(x²−x−6) ÷ (2x−3)/(x−3)","a":"(2x+3)/(x+2), x≠−2,3,3/2"},{"q":"(x²−4x+4)/(x²−1) ÷ (x−2)/(x+1)","a":"(x−2)/(x−1), x≠−1,1,2"}]},"rational:3":{"summary":"Adding or subtracting rational expressions requires a least common denominator. Rewrite each fraction with that denominator, combine only the numerators, then factor and simplify.","steps":["Factor every denominator.","Build the LCD using each factor at its greatest required power.","Multiply each numerator by its missing factors.","Combine numerators, factor, simplify, and retain restrictions."],"mistakes":["Adding denominators.","Failing to distribute a subtraction sign through the second numerator.","Using a common denominator that is not fully factored."],"examples":[{"q":"2/x + 3/(x+1)","a":"(5x+2)/(x(x+1)), x≠0,−1"},{"q":"1/(x−2) − 4/(x+2)","a":"(−3x+10)/(x²−4), x≠±2"}],"practice":[{"q":"3/x + 2/(x−1)","a":"(5x−3)/(x(x−1)), x≠0,1"},{"q":"5/(x+2) − 1/(x−2)","a":"(4x−12)/(x²−4), x≠±2"},{"q":"2/(x²−1) + 3/(x+1)","a":"(3x−1)/(x²−1), x≠±1"},{"q":"x/(x−3) − 6/(x²−9)","a":"(x²+3x−6)/(x²−9), x≠±3"},{"q":"1/x + 1/(x+1) + 1/(x+2)","a":"(3x²+6x+2)/(x(x+1)(x+2)), x≠0,−1,−2"}]},"rational:4":{"summary":"A complex fraction contains smaller fractions in its numerator, denominator, or both. Multiply the entire large numerator and denominator by the LCD of every small denominator.","steps":["List all small denominators.","Find their LCD.","Multiply every term in the large numerator and denominator by the LCD.","Simplify the resulting ordinary rational expression."],"mistakes":["Multiplying only some terms by the LCD.","Treating the fraction bar as if it were addition.","Losing restrictions from the original small denominators."],"examples":[{"q":"(1/x + 1/y)/(1/x − 1/y)","a":"(x+y)/(y−x), x≠0, y≠0, x≠y"},{"q":"(2 + 3/x)/(1 − 1/x)","a":"(2x+3)/(x−1), x≠0,1"}],"practice":[{"q":"(1 + 2/x)/(3 − 1/x)","a":"(x+2)/(3x−1), x≠0,1/3"},{"q":"(1/a − 1/b)/(1/a + 1/b)","a":"(b−a)/(a+b), a≠0,b≠0,a≠−b"},{"q":"(x + 1/x)/(x − 1/x)","a":"(x²+1)/(x²−1), x≠0,±1"},{"q":"(2/x + 3)/(4/x − 1)","a":"(3x+2)/(4−x), x≠0,4"},{"q":"(1/(x−1)+1)/(1/(x−1)−1)","a":"x/(2−x), x≠1,2"}]},"exponents:0":{"summary":"For the same nonzero base, multiplication adds exponents and division subtracts exponents. The rule applies only when the bases match.","steps":["Identify identical bases.","Add exponents for products or subtract denominator exponents for quotients.","Simplify coefficients separately.","Rewrite with positive exponents if requested."],"mistakes":["Combining exponents when bases differ.","Multiplying exponents during ordinary multiplication.","Forgetting denominator restrictions."],"examples":[{"q":"x³x⁵","a":"x⁸"},{"q":"12a⁷b³/(3a²b⁵)","a":"4a⁵/b²"}],"practice":[{"q":"m⁴m⁹","a":"m¹³"},{"q":"18x⁸/(6x³)","a":"3x⁵"},{"q":"4a³b⁷ · 3a⁵b","a":"12a⁸b⁸"},{"q":"20p⁶q²/(5p²q⁷)","a":"4p⁴/q⁵"},{"q":"x⁵y⁻² · x⁻³y⁷","a":"x²y⁵"}]},"exponents:1":{"summary":"A power raised to another power multiplies exponents. When a product or quotient is raised to a power, that power applies to every factor.","steps":["Distribute the outer exponent to every factor.","Multiply nested exponents.","Raise numerical coefficients to the outer power.","Simplify and rewrite positive exponents."],"mistakes":["Adding nested exponents instead of multiplying.","Applying the power to only one factor.","Forgetting to power the coefficient."],"examples":[{"q":"(x³)⁴","a":"x¹²"},{"q":"(2a²b³)³","a":"8a⁶b⁹"}],"practice":[{"q":"(m⁵)³","a":"m¹⁵"},{"q":"(3x²y)²","a":"9x⁴y²"},{"q":"(a³/b²)⁴","a":"a¹²/b⁸"},{"q":"(−2p²q³)³","a":"−8p⁶q⁹"},{"q":"((x²)³)⁴","a":"x²⁴"}]},"exponents:2":{"summary":"Any nonzero base to the zero power equals 1. A negative exponent indicates a reciprocal; it does not make the value negative.","steps":["Replace a⁰ with 1 when a≠0.","Move factors with negative exponents across the fraction bar.","Change each moved exponent to positive.","Simplify coefficients and state nonzero restrictions."],"mistakes":["Thinking a negative exponent makes a negative number.","Writing a⁰=0.","Moving a sum instead of a factor across the fraction bar."],"examples":[{"q":"x⁻³","a":"1/x³"},{"q":"(2a⁻²b³)/(4b⁻¹)","a":"b⁴/(2a²)"}],"practice":[{"q":"5x⁰","a":"5"},{"q":"a⁻⁴b²","a":"b²/a⁴"},{"q":"3x⁻²/y⁻³","a":"3y³/x²"},{"q":"(2m⁻¹n²)⁻²","a":"m²/(4n⁴)"},{"q":"x⁻² + x⁰","a":"1/x² + 1"}]},"exponents:3":{"summary":"A rational exponent a^(m/n) means take the nth root and raise to the mth power. The denominator controls the root; the numerator controls the power.","steps":["Identify the root from the denominator.","Identify the power from the numerator.","Choose the order that makes computation easiest.","Check real-domain restrictions for even roots."],"mistakes":["Reversing numerator and denominator roles.","Ignoring domain restrictions for even roots.","Distributing a rational exponent over addition."],"examples":[{"q":"64^(2/3)","a":"16"},{"q":"x^(5/2)","a":"x²√x (for x≥0)"}],"practice":[{"q":"27^(2/3)","a":"9"},{"q":"16^(3/4)","a":"8"},{"q":"81^(−1/2)","a":"1/9"},{"q":"x^(7/3)","a":"x²∛x"},{"q":"(32x⁵)^(1/5)","a":"2x (for real x)"}]},"exponents:4":{"summary":"Multi-rule expressions combine product, quotient, power, zero, negative, and rational exponent rules. Simplify one structural layer at a time.","steps":["Simplify powers of powers first.","Combine like bases in products and quotients.","Move negative exponents to create positive exponents.","Simplify coefficients and check restrictions."],"mistakes":["Trying to perform every rule mentally in one jump.","Combining unlike bases.","Losing parentheses around a quotient raised to a power."],"examples":[{"q":"(3x⁻²y³)²/(9y)","a":"y⁵/x⁴"},{"q":"(a^(1/2)a^(3/2))/a⁻¹","a":"a³"}],"practice":[{"q":"(2x³y⁻²)²/(4xy⁻¹)","a":"x⁵/y³"},{"q":"(a⁻²b³)⁻² · a³b","a":"a⁷/b⁵"},{"q":"(x^(2/3))³/x⁻¹","a":"x³"},{"q":"(4m⁰n⁻¹)²/(8n⁻³)","a":"2n"},{"q":"(9x⁴)^(1/2) · x⁻³","a":"3/x (assuming x>0)"}]},"equations:0":{"summary":"Linear equations contain the variable only to the first power after simplification. Preserve equality by performing the same operation on both sides.","steps":["Distribute and combine like terms on each side.","Move variable terms to one side.","Move constants to the other side.","Divide by the coefficient and check."],"mistakes":["Distributing a negative incorrectly.","Moving a term without changing its sign through an inverse operation.","Missing identity or contradiction cases."],"examples":[{"q":"3(2x−1)=4x+7","a":"x=5"},{"q":"5(x−2)+3=5x−7","a":"All real numbers"}],"practice":[{"q":"4(3x−2)=2x+12","a":"x=2"},{"q":"7−2(x+3)=3x+1","a":"x=0"},{"q":"5x−4=2(2x+3)","a":"x=10"},{"q":"3(x−5)+2x=5x−15","a":"All real numbers"},{"q":"2(4x+1)=8x+5","a":"No solution"}]},"equations:1":{"summary":"A quadratic equation can be solved by factoring when it can be written as a product equal to zero. The zero-product property then sets each factor equal to zero.","steps":["Move every term to one side so the other side is zero.","Factor the quadratic completely.","Set each factor equal to zero.","Solve each linear equation and check."],"mistakes":["Using the zero-product property before one side is zero.","Dropping one factor’s solution.","Factoring with incorrect signs."],"examples":[{"q":"x²−7x+12=0","a":"x=3,4"},{"q":"2x²−5x−3=0","a":"x=3,−1/2"}],"practice":[{"q":"x²+2x−15=0","a":"x=3,−5"},{"q":"3x²−12x=0","a":"x=0,4"},{"q":"2x²+7x+3=0","a":"x=−3,−1/2"},{"q":"4x²−25=0","a":"x=±5/2"},{"q":"6x²−x−2=0","a":"x=2/3,−1/2"}]},"equations:2":{"summary":"When factoring is inconvenient, use square roots, completing the square, or the quadratic formula. The discriminant b²−4ac predicts the number and type of roots.","steps":["Write the equation in standard form ax²+bx+c=0.","Choose a suitable method.","If using the formula, substitute carefully into (−b±√(b²−4ac))/(2a).","Simplify and verify."],"mistakes":["Forgetting ± after taking a square root.","Using 2a only under the radical instead of as the full denominator.","Dropping the negative sign on b."],"examples":[{"q":"x²−6x+1=0","a":"x=3±2√2"},{"q":"2x²+x−4=0","a":"x=(−1±√33)/4"}],"practice":[{"q":"x²=20","a":"x=±2√5"},{"q":"x²+4x−1=0","a":"x=−2±√5"},{"q":"3x²−2x−7=0","a":"x=(1±√22)/3"},{"q":"(x−5)²=12","a":"x=5±2√3"},{"q":"4x²+4x+5=0","a":"x=(−1±2i)/2"}]},"equations:3":{"summary":"Rational equations contain variable expressions in denominators. List restrictions, multiply every term by the LCD, solve the resulting equation, then reject prohibited values.","steps":["Identify values that make any denominator zero.","Find the LCD.","Multiply every term on both sides by the LCD.","Solve and check each candidate in the original equation."],"mistakes":["Multiplying only one side by the LCD.","Forgetting to distribute the LCD to every term.","Keeping a solution that violates a restriction."],"examples":[{"q":"1/x + 1/(x+2)=3/4","a":"x=2 or x=−4/3"},{"q":"2/(x−1)=x/(x−1)","a":"x=2 (x≠1)"}],"practice":[{"q":"1/x + 1/2 = 3/4","a":"x=4"},{"q":"3/(x−2)=1+1/(x−2)","a":"x=4"},{"q":"1/(x+1)+1/(x−1)=1","a":"x=1±√2"},{"q":"x/(x−3)=3/(x−3)","a":"No solution (candidate x=3 is restricted)"},{"q":"2/x − 3/(x+1)=1/(x(x+1))","a":"x=1"}]},"equations:4":{"summary":"Radical equations are solved by isolating a radical and raising both sides to the needed power. Squaring can create extraneous roots, so every candidate must be checked in the original equation.","steps":["State domain restrictions.","Isolate one radical.","Raise both sides to eliminate it.","Repeat if necessary, solve, and check all candidates."],"mistakes":["Squaring a sum incorrectly.","Failing to isolate the radical first.","Accepting an extraneous solution without checking."],"examples":[{"q":"√(x+5)=x−1","a":"x=4"},{"q":"√(2x+3)+1=x","a":"x=3"}],"practice":[{"q":"√(x+6)=x","a":"x=3"},{"q":"√(3x+4)=x+2","a":"x=0"},{"q":"√(x−1)=5−x","a":"x=(11−√17)/2"},{"q":"√(x+2)+√(x−1)=3","a":"x=2"},{"q":"∛(2x−1)=3","a":"x=14"}]},"inequalities:0":{"summary":"Linear and compound inequalities are solved like linear equations, except multiplying or dividing by a negative reverses the inequality symbol. AND means intersection; OR means union.","steps":["Simplify each part.","Isolate the variable.","Reverse the inequality when multiplying or dividing by a negative.","Graph and translate to interval notation."],"mistakes":["Forgetting to reverse the sign.","Confusing AND with OR.","Using brackets on strict inequalities."],"examples":[{"q":"−2<3x+1≤10","a":"−1<x≤3"},{"q":"2x−5<−9 or 3x+1≥10","a":"x<−2 or x≥3"}],"practice":[{"q":"5x−7≤18","a":"x≤5"},{"q":"−3x+4>16","a":"x<−4"},{"q":"1≤2x−3<9","a":"2≤x<6"},{"q":"4x+1<−7 or 2x−5≥3","a":"x<−2 or x≥4"},{"q":"−5≤(x−1)/2≤4","a":"−9≤x≤9"}]},"inequalities:1":{"summary":"Polynomial inequalities are solved with a sign chart. Zeros divide the number line into intervals, and the polynomial’s sign is constant within each interval.","steps":["Move all terms to one side.","Factor the polynomial.","Mark every real zero on a number line.","Test each interval and include zeros when the inequality allows equality."],"mistakes":["Solving each factor separately as if the expression were an equation.","Skipping intervals.","Excluding a zero when ≤ or ≥ permits it."],"examples":[{"q":"(x−2)(x+5)>0","a":"(−∞,−5)∪(2,∞)"},{"q":"x(x−3)≤0","a":"[0,3]"}],"practice":[{"q":"(x−1)(x+4)<0","a":"(−4,1)"},{"q":"x²−9≥0","a":"(−∞,−3]∪[3,∞)"},{"q":"x(x−2)(x+1)>0","a":"(−1,0)∪(2,∞)"},{"q":"(x−3)²(x+2)≤0","a":"(−∞,−2]∪{3}"},{"q":"x⁴−5x²+4<0","a":"(−2,−1)∪(1,2)"}]},"inequalities:2":{"summary":"Rational inequalities require both numerator zeros and denominator exclusions. These critical numbers divide the line into intervals for a sign chart.","steps":["Move everything to one rational expression compared with zero.","Factor numerator and denominator.","Mark numerator zeros and denominator exclusions.","Test intervals; never include denominator zeros."],"mistakes":["Cross-multiplying by an expression of unknown sign.","Including a denominator zero.","Forgetting that canceled denominator factors remain exclusions."],"examples":[{"q":"(x−3)/(x+2)≤0","a":"(−2,3]"},{"q":"(x+1)/(x−4)>0","a":"(−∞,−1)∪(4,∞)"}],"practice":[{"q":"(x−2)/(x+5)≥0","a":"(−∞,−5)∪[2,∞)"},{"q":"x/(x−3)<0","a":"(0,3)"},{"q":"(x+1)(x−4)/(x−2)≤0","a":"(−∞,−1]∪(2,4]"},{"q":"(x²−9)/(x−1)>0","a":"(−3,1)∪(3,∞)"},{"q":"(x−2)/(x−2)(x+1)≥0","a":"(−1,2)∪(2,∞)"}]},"inequalities:3":{"summary":"Absolute-value inequalities describe distance. |u|<a means u lies between −a and a; |u|>a means u lies outside that interval when a>0.","steps":["Isolate the absolute-value expression.","For < or ≤, write a compound AND inequality.","For > or ≥, write an OR inequality.","Solve each part and graph the result."],"mistakes":["Using OR for a less-than inequality.","Ignoring the case when the comparison number is negative.","Forgetting both branches."],"examples":[{"q":"|2x−1|≤5","a":"−2≤x≤3"},{"q":"|x+3|>4","a":"x<−7 or x>1"}],"practice":[{"q":"|3x+2|<8","a":"−10/3<x<2"},{"q":"|x−5|≥2","a":"x≤3 or x≥7"},{"q":"2|x+1|≤10","a":"−6≤x≤4"},{"q":"|4−x|>6","a":"x<−2 or x>10"},{"q":"|2x−3|<−1","a":"No solution"}]},"inequalities:4":{"summary":"Interval notation is a compact way to describe sets on the number line. Parentheses exclude endpoints; brackets include finite endpoints; infinity always uses parentheses.","steps":["Identify the left and right boundaries.","Use a bracket for ≤ or ≥ at a finite endpoint.","Use a parenthesis for <, >, exclusions, and infinities.","Use ∪ to join separated intervals."],"mistakes":["Using a bracket with ±∞.","Reversing endpoint order.","Using a comma where a union symbol is needed."],"examples":[{"q":"x≤−2 or x>5","a":"(−∞,−2]∪(5,∞)"},{"q":"−1<x≤4","a":"(−1,4]"}],"practice":[{"q":"Write [−3,7) as inequalities","a":"−3≤x<7"},{"q":"Write x<1 or x≥6 in interval notation","a":"(−∞,1)∪[6,∞)"},{"q":"Write (−2,5] as inequalities","a":"−2<x≤5"},{"q":"Write all real numbers except 4","a":"(−∞,4)∪(4,∞)"},{"q":"Write x≥−1 in interval notation","a":"[−1,∞)"}]},"ap-connection:0":{"summary":"Equivalent algebraic forms emphasize different features of the same function. Factored form highlights zeros, expanded form supports end behavior, and completed-square or vertex form reveals extrema.","steps":["Identify what feature the question asks about.","Choose or create the form that makes that feature visible.","Preserve domain restrictions while rewriting.","Explain why the chosen form is useful."],"mistakes":["Assuming equivalent formulas always have identical domains.","Expanding when factored form is more informative.","Giving a form without interpreting it."],"examples":[{"q":"Rewrite x²−5x+6 to show its zeros","a":"(x−2)(x−3), so zeros are 2 and 3"},{"q":"Rewrite x²−6x+5 to show its vertex","a":"(x−3)²−4, so vertex is (3,−4)"}],"practice":[{"q":"Rewrite 2x²−8x+6 in vertex form","a":"2(x−2)²−2"},{"q":"Rewrite x³−4x to show all zeros","a":"x(x−2)(x+2)"},{"q":"Which form of (x−1)(x+4) best reveals the y-intercept?","a":"Expanded form x²+3x−4; y-intercept −4"},{"q":"Rewrite (x²−9)/(x−3) and describe the domain","a":"x+3 with x≠3"},{"q":"Rewrite 3(x−2)²+5 in standard form","a":"3x²−12x+17"}]},"ap-connection:1":{"summary":"Rational-function analysis connects algebra to graph features. Original denominator zeros give restrictions; canceled factors give holes; remaining denominator factors give vertical asymptotes.","steps":["Factor numerator and denominator.","State original restrictions.","Cancel common factors and locate holes.","Find asymptotes, intercepts, and sign intervals from the simplified form."],"mistakes":["Calling a canceled factor a vertical asymptote.","Forgetting to compute the hole’s y-value.","Finding intercepts using excluded x-values."],"examples":[{"q":"Analyze (x²−1)/(x²−3x+2)","a":"Hole at (1,2); VA x=2; HA y=1; x-int −1; y-int −1/2"},{"q":"Analyze (2x+1)/(x−3)","a":"VA x=3; HA y=2; x-int −1/2; y-int −1/3"}],"practice":[{"q":"For (x²−4)/(x²−x−2), identify hole and VA","a":"Hole at (−2,4/−3); VA x=1"},{"q":"Find asymptotes of (3x²+1)/(x²−4)","a":"VA x=±2; HA y=3"},{"q":"Find intercepts of (x−5)/(x+2)","a":"x-int 5; y-int −5/2"},{"q":"Analyze (x²−9)/(x²+x−6)","a":"Hole (−3,6/−5=−6/5); VA x=2; HA y=1; x-int 3; y-int 3/2"},{"q":"Where is (x−1)/(x+4) positive?","a":"(−∞,−4)∪(1,∞)"}]},"ap-connection:2":{"summary":"A difference quotient measures average rate of change over an interval of length h. Algebraic simplification often reveals the expression that approaches an instantaneous rate later in calculus.","steps":["Compute f(x+h) carefully using parentheses.","Subtract f(x).","Expand and combine like terms.","Factor and cancel h, while keeping h≠0."],"mistakes":["Failing to distribute the subtraction across f(x).","Expanding (x+h)² incorrectly.","Canceling h before it is a factor of every numerator term."],"examples":[{"q":"For f(x)=x², simplify [f(x+h)−f(x)]/h","a":"2x+h"},{"q":"For f(x)=3x−4, simplify the difference quotient","a":"3"}],"practice":[{"q":"f(x)=x²+2x; simplify the difference quotient","a":"2x+h+2"},{"q":"f(x)=x³; simplify the difference quotient","a":"3x²+3xh+h²"},{"q":"f(x)=1/x; simplify the difference quotient","a":"−1/(x(x+h))"},{"q":"f(x)=2x²−5x; simplify","a":"4x+2h−5"},{"q":"f(x)=√x; rationalize the difference quotient","a":"1/(√(x+h)+√x)"}]},"ap-connection:3":{"summary":"An AP free-response justification must state both the mathematics and what it means. A complete response identifies the quantity, gives evidence, and includes units or contextual interpretation when appropriate.","steps":["State the conclusion in a complete sentence.","Reference the calculation, graph feature, table pattern, or theorem supporting it.","Use correct units and interval language.","Connect the evidence directly to the requested claim."],"mistakes":["Giving only a number.","Using vague phrases such as “because the graph goes up.”","Omitting units or the interval of validity."],"examples":[{"q":"A quantity rises from 20 to 32 over 4 hours. Interpret its average rate.","a":"The quantity increased on average by 3 units per hour over the 4-hour interval."},{"q":"Explain why x=2 is not in a rational function’s domain.","a":"At x=2 the original denominator equals zero, so the function is undefined there."}],"practice":[{"q":"A population model has f(5)=180 and f(9)=244. Interpret the average rate.","a":"The population increased on average by 16 individuals per time unit from t=5 to t=9."},{"q":"Justify that x=3 is a zero of f(x)=(x−3)(x+1).","a":"Substituting x=3 makes the factor x−3 equal zero, so f(3)=0."},{"q":"Explain why a canceled factor creates a hole.","a":"The simplified formula has a finite limit there, but the original denominator was zero, so the point is excluded."},{"q":"Interpret a horizontal asymptote y=2.","a":"As x becomes very large positive or negative, the function values approach 2."},{"q":"Justify that a function is decreasing on an interval from a table.","a":"As x increases through the interval, the listed function values consistently decrease."}]},"ap-connection:4":{"summary":"AP Precalculus asks students to connect formulas, graphs, tables, and verbal descriptions. Each representation reveals some features more clearly than others.","steps":["Identify the same input-output relationship in each representation.","Match zeros, intercepts, extrema, rates, and asymptotes.","Translate numerical patterns into algebraic or verbal claims.","Check that all representations share the same domain and scale."],"mistakes":["Reading a table’s row number as the x-value.","Ignoring graph scale.","Assuming a finite table proves global behavior."],"examples":[{"q":"A table has constant first differences of 4.","a":"It is consistent with a linear function of slope 4."},{"q":"A graph crosses the x-axis at −2 and 5.","a":"A matching factored form contains (x+2)(x−5)."}],"practice":[{"q":"A table’s y-values multiply by 3 whenever x increases by 1. What model type fits?","a":"Exponential growth with base 3."},{"q":"A graph has vertex (2,−5). Give a possible quadratic form.","a":"a(x−2)²−5 for any nonzero a."},{"q":"A rational graph has VA x=4 and HA y=2. Give a simple possible formula.","a":"2+1/(x−4)"},{"q":"A line passes through (1,3) and (5,11). Find a formula.","a":"y=2x+1"},{"q":"A table shows f(0)=1, f(1)=2, f(2)=4, f(3)=8. Give a formula.","a":"f(x)=2^x"} function popupEscape(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function openTypeWindow(topic, type, typeIndex){
  const detail = typeLessons[`${topic.id}:${typeIndex}`] || {
    summary:type.example,
    steps:["Identify the structure.","Choose the matching method.","Show each algebraic step.","Check the result."],
    mistakes:["Skipping the classification step.","Losing restrictions or signs."],
    examples:[],
    practice:topic.problems || []
  };
  const win = window.open("", "_blank", "width=1000,height=850,scrollbars=yes,resizable=yes");
  if(!win){
    alert("Your browser blocked the new lesson window. Allow pop-ups for this site and click the problem type again.");
    return;
  }
  try{ win.opener = null; }catch(e){}
  const list = items => items.map(item=>`<li>${popupEscape(item)}</li>`).join("");
  const examples = (detail.examples||[]).map((p,i)=>`<article class="example"><div class="number">${i+1}</div><div><h3>${popupEscape(p.q)}</h3><details><summary>Show worked answer</summary><p>${popupEscape(p.a)}</p></details></div></article>`).join("");
  const practice = (detail.practice||[]).map((p,i)=>`<article class="practice"><div class="number">${i+1}</div><div><h3>${popupEscape(p.q)}</h3><details><summary>Check answer</summary><p>${popupEscape(p.a || p.answer)}</p></details></div></article>`).join("");
  const html = `<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${popupEscape(type.name)} — AP Algebra Lab</title>
<style>
:root{--ink:#122033;--paper:#f5f2ea;--cream:#fffdf7;--coral:#e85d3f;--blue:#2e6f95;--line:#d8d3c7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.bar{position:sticky;top:0;z-index:4;background:var(--cream);border-bottom:1px solid var(--line);padding:14px 5vw;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:700 18px Georgia,serif}.bar button{border:0;background:var(--ink);color:#fff;padding:10px 15px;cursor:pointer}.hero{padding:58px 7vw;background:linear-gradient(135deg,#fff7df,#fffdf7);border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--coral);text-transform:uppercase}.hero h1{font:700 clamp(36px,6vw,68px)/1 Georgia,serif;margin:15px 0}.hero p{font:18px/1.65 Georgia,serif;color:#4d5866;max-width:900px}.content{max-width:1050px;margin:auto;padding:40px 24px 70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--cream);border:1px solid var(--line);padding:25px}.panel h2{font:26px Georgia,serif;margin:0 0 17px}.panel li{margin:10px 0;line-height:1.5}.section{margin-top:30px}.section>h2{font:32px Georgia,serif;border-bottom:1px solid var(--line);padding-bottom:12px}.example,.practice{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--cream);border:1px solid var(--line);padding:20px;margin:12px 0}.number{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}.example h3,.practice h3{font:19px/1.4 Georgia,serif;margin:4px 0 12px}.example summary,.practice summary{color:var(--blue);cursor:pointer;font-weight:700}.example details p,.practice details p{padding:12px;background:#f1ece1;border-left:4px solid var(--coral);font:16px/1.5 Georgia,serif}.note{margin-top:26px;padding:18px;border-left:4px solid var(--coral);background:#f4efe4}.footer{padding:26px;text-align:center;color:#6b7280;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.hero{padding:40px 24px}.bar{align-items:flex-start}.content{padding:28px 16px 55px}}
</style></head><body>
<div class="bar"><div class="brand">AP Algebra Lab · Focused Problem-Type Lesson</div><button onclick="window.print()">Print lesson</button></div>
<section class="hero"><div class="eyebrow">${popupEscape(topic.title)} · Type ${String(typeIndex+1).padStart(2,"0")}</div><h1>${popupEscape(type.name)}</h1><p>${popupEscape(detail.summary)}</p></section>
<main class="content">
<div class="grid"><section class="panel"><h2>How to approach it</h2><ol>${list(detail.steps||[])}</ol></section><section class="panel"><h2>Common mistakes</h2><ul>${list(detail.mistakes||[])}</ul></section></div>
${examples ? `<section class="section"><h2>Worked examples</h2>${examples}</section>` : ""}
<section class="section"><h2>Extra practice</h2>${practice}</section>
<div class="note"><b>AP habit:</b> Show the algebra, preserve restrictions, and explain what the result means when the question is about a function.</div>
</main><div class="footer">AP Precalculus Algebra Fluency Lab · Problem-Type Explorer v2.0</div>
</body></html>`;
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.focus();
}

const normalize = (s) => s.toLowerCase().replace(/\s+/g, "").replace(/[−–]/g, "-").replace(/\^/g, "");

function AlgebraFluencyLab() {
  const [active, setActive] = useState("factoring");
  const [answers, setAnswers] = useState({});
  const [checks, setChecks] = useState({});
  const [saved, setSaved] = useState([]);
  const [title, setTitle] = useState(""); const [url, setUrl] = useState(""); const [resourceTopic, setResourceTopic] = useState("factoring");
  const [query, setQuery] = useState("");
  useEffect(() => { try { setSaved(JSON.parse(localStorage.getItem("ap-precalc-links") || "[]")); } catch {} }, []);
  const topic = topics.find(t => t.id === active);
  const filtered = useMemo(() => topics.filter(t => (t.title+t.concept+t.types.map(x=>x.name).join(" ")).toLowerCase().includes(query.toLowerCase())), [query]);
  function addLink(e) { e.preventDefault(); if (!title.trim() || !/^https?:\/\//i.test(url)) return; const next=[...saved,{title:title.trim(),url,topic:resourceTopic}]; setSaved(next); localStorage.setItem("ap-precalc-links",JSON.stringify(next)); setTitle(""); setUrl(""); }
  function removeLink(i){const next=saved.filter((_,n)=>n!==i);setSaved(next);localStorage.setItem("ap-precalc-links",JSON.stringify(next));}

  return <main>
    <header className="topbar"><a className="brand" href="#top"><span>AP</span> Algebra Lab</a><nav><a href="#learn">Learn</a><a href="#practice">Practice</a><a href="#resources">Resources</a></nav><div className="status"><i/> Problem-Type Explorer v2.0</div></header>
    <section className="hero" id="top">
      <div className="hero-copy"><p className="kicker">Algebra Fluency for AP Precalculus</p><h1>Build the algebra.<br/><em>See the function.</em></h1><p className="dek">A focused study lab for the skills beneath AP Precalculus Unit 1—organized by concept, problem type, deliberate practice, and the best next resource.</p><div className="hero-actions"><a className="primary" href="#learn">Begin module →</a><span>6 sections · 18 checks · saved resources</span></div></div>
      <div className="formula-card"><div className="grid-lines"/><span className="tiny">TODAY’S IDEA</span><div className="equation">a² − b²</div><div className="equals">=</div><div className="equation accent">(a − b)(a + b)</div><p>Structure turns a hard expression into a useful one.</p></div>
    </section>
    <section className="module-strip"><span>DIAGNOSE</span><b>→</b><span>LEARN</span><b>→</b><span>PRACTICE</span><b>→</b><span>CONNECT TO AP</span></section>

    <section className="study" id="learn">
      <aside className="side"><label>Find a skill</label><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search topics…"/><p className="side-label">CORE SECTIONS</p>{filtered.map(t=><button className={active===t.id?"active":""} key={t.id} onClick={()=>setActive(t.id)}><span>{t.number}</span>{t.title}</button>)}<a className="ap-link" href="#ap-check">★ AP readiness check</a></aside>
      <article className="lesson">
        <div className={`lesson-head ${topic.color}`}><div><p>{topic.eyebrow}</p><h2>{topic.title}</h2></div><span>{topic.number} / 06</span></div>
        <div className="concept"><h3>The essential idea</h3><p>{topic.concept}</p><div className="memory"><b>Keep in view</b>{topic.key}</div></div>
        <div className="problem-types"><div className="section-title"><span>PROBLEM TYPES</span><p>Learn to identify the structure before choosing a method.</p></div><div className="type-grid">{topic.types.map((x,i)=><button type="button" className="type-card" key={x.name} onClick={()=>openTypeWindow(topic,x,i)} aria-label={`Open more information and practice for ${x.name}`}><span>{String(i+1).padStart(2,"0")}</span><h4>{x.name}</h4><p>{x.example}</p><span className="type-open">Open lesson ↗</span></button>)}</div></div>
        <div className="practice" id="practice"><div className="section-title"><span>PRACTICE STUDIO</span><p>Try each problem without notes. Use the hint only when stuck.</p></div>{topic.problems.map((p,i)=>{const key=topic.id+i;return <div className="practice-row" key={key}><div className="problem-no">{i+1}</div><div className="problem-main"><h4>{p.q}</h4><details><summary>Give me a hint</summary><p>{p.hint}</p></details><div className="answer-line"><input aria-label={`Answer to problem ${i+1}`} value={answers[key]||""} onChange={e=>setAnswers({...answers,[key]:e.target.value})} placeholder="Type your answer"/><button onClick={()=>setChecks({...checks,[key]:true})}>Check</button></div>{checks[key]&&<div className={`feedback ${normalize(answers[key]||"")===normalize(p.answer)?"correct":"review"}`}>{normalize(answers[key]||"")===normalize(p.answer)?"Correct — nice work.":<>Compare with: <b>{p.answer}</b>. If equivalent, count it correct.</>}</div>}</div></div>})}</div>
        <div className="resources" id="resources"><div className="section-title"><span>LEARN IT ANOTHER WAY</span><p>Open a focused explanation or a longer practice path.</p></div><div className="resource-grid">{topic.resources.map(r=><a href={r.url} target="_blank" rel="noreferrer" key={r.url}><span>{r.kind}</span><h4>{r.label}</h4><b>Open ↗</b></a>)}</div></div>
        <div className="next"><span>Next section</span><button onClick={()=>{const i=topics.findIndex(t=>t.id===topic.id); setActive(topics[(i+1)%topics.length].id); document.getElementById("learn")?.scrollIntoView({behavior:"smooth"});}}>{topics[(topics.findIndex(t=>t.id===topic.id)+1)%topics.length].title} →</button></div>
      </article>
    </section>

    <section className="ap-check" id="ap-check"><div><p className="kicker">AP READINESS CHECK</p><h2>Can you connect the algebra<br/>to the graph?</h2><p>For <b>f(x) = (x² − 9)/(x² + x − 6)</b>, work through the full analysis.</p></div><ol><li>Factor numerator and denominator.</li><li>State every original restriction.</li><li>Simplify and identify the hole.</li><li>Find vertical and horizontal asymptotes.</li><li>Find both intercepts.</li><li>Describe where f is positive and negative.</li></ol></section>

    <section className="library"><div className="library-head"><div><p className="kicker">YOUR RESOURCE SHELF</p><h2>Save a useful link.</h2><p>Add a teacher’s page, practice set, Desmos activity, or specific YouTube lesson. Links stay saved in this browser.</p></div><form onSubmit={addLink}><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Resource title" required/><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://…" type="url" required/><select value={resourceTopic} onChange={e=>setResourceTopic(e.target.value)}>{topics.map(t=><option value={t.id} key={t.id}>{t.title}</option>)}</select><button>Add resource +</button></form></div>{saved.length>0?<div className="saved-grid">{saved.map((r,i)=><div className="saved" key={i}><span>{topics.find(t=>t.id===r.topic)?.title}</span><a href={r.url} target="_blank" rel="noreferrer">{r.title} ↗</a><button aria-label="Remove resource" onClick={()=>removeLink(i)}>×</button></div>)}</div>:<div className="empty">Your saved links will appear here.</div>}</section>
    <footer><div className="brand"><span>AP</span> Algebra Lab</div><p>Problem-Type Explorer v2.0 · Click any problem type for a focused lesson and extra practice.</p><a href="#top">Back to top ↑</a></footer>
  </main>;
}

ReactDOM.createRoot(document.getElementById('ap-algebra-lab-root')).render(<AlgebraFluencyLab />);
  </script>
</body>
