<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>School Assignment Tracker — v4.0 Omi Classroom</title>
  <link rel="icon" href="data:,">
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#f4f4f5;
    }
    #trackerFrame{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#f4f4f5;
    }
    #bootError{
      display:none;
      position:fixed;
      inset:0;
      z-index:9999;
      padding:24px;
      background:#f4f4f5;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:#0f172a;
    }
    #bootError .card{
      max-width:680px;
      margin:10vh auto;
      background:#fff;
      border:1px solid #e4e4e7;
      border-radius:16px;
      padding:20px;
      box-shadow:0 12px 35px rgba(15,23,42,.08);
    }
  </style>
</head>
<body>
  <iframe id="trackerFrame" title="School Assignment Tracker"></iframe>

  <div id="bootError">
    <div class="card">
      <strong>Tracker failed to load.</strong>
      <div id="bootErrorText" style="margin-top:8px"></div>
    </div>
  </div>

  <script>
  (function(){
    'use strict';

    const frame = document.getElementById('trackerFrame');

    // Preserve invite/auth query parameters and hashes when the wrapper loads the tracker.
    frame.src = './tracker-v3.9-base.html?v=20260906-v4-wrapper'
      + (window.location.search || '')
      + (window.location.hash || '');

    function showError(message){
      document.getElementById('bootErrorText').textContent =
        String(message || 'Unknown error');
      document.getElementById('bootError').style.display = 'block';
    }

    function addScript(doc, src, id){
      return new Promise((resolve,reject)=>{
        if(doc.getElementById(id)){
          resolve();
          return;
        }
        const s = doc.createElement('script');
        s.id = id;
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Could not load ' + src));
        (doc.body || doc.documentElement).appendChild(s);
      });
    }

    frame.addEventListener('load', async ()=>{
      try{
        const doc = frame.contentDocument;
        if(!doc) throw new Error('Could not access the tracker page.');

        doc.title = 'School Assignment Tracker — v4.0 Omi Classroom';

        const title = doc.querySelector('h1');
        if(title && /v3\.9/.test(title.textContent || '')){
          title.textContent = (title.textContent || '')
            .replace(/v3\.9/g,'v4.0')
            .replace(/Canvas \+ Classroom Scraper/g,'Canvas + Classroom + Omi');
        }

        const badge = doc.querySelector('.version-badge');
        if(badge){
          badge.textContent = 'v4.0';
          badge.setAttribute('aria-label','App version v4.0');
        }

        // Load the Omi UI first, then the automatic sync helper.
        await addScript(doc,'./omi-classroom.js?v=20260906-4','omiClassroomScript');
        await addScript(doc,'./omi-auto-sync.js?v=20260906-3','omiAutoSyncScript');
      }catch(err){
        console.error('Omi integration load error',err);
        showError(err && err.message || err);
      }
    });

    frame.addEventListener('error', ()=>{
      showError('The tracker base page could not be loaded.');
    });
  })();
  </script>
</body>
</html>
