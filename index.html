<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Assignment Tracker</title>
<style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f4f5;color:#0f172a}.boot{min-height:100vh;display:grid;place-items:center}.boot-card{background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:22px;box-shadow:0 12px 35px rgba(15,23,42,.08);max-width:520px}</style>
</head>
<body><div class="boot"><div class="boot-card"><strong>Loading School Assignment Tracker…</strong><div style="margin-top:6px;font-size:13px;color:#64748b">Canvas, Google Classroom, Rewards, and Omi classroom transcripts</div></div></div>
<script>
(async function(){
  try{
    const r=await fetch('./tracker-v3.9-base.html?v=20260906-omi',{cache:'no-store'});
    if(!r.ok) throw new Error('Could not load tracker base: '+r.status);
    let html=await r.text();
    html=html.replace(/School Assignment Tracker — v3\.9 Canvas \+ Classroom Scraper/g,'School Assignment Tracker — v4.0 Omi Classroom');
    html=html.replace(/<div class="version-badge" aria-label="App version">v3\.9<\/div>/,'<div class="version-badge" aria-label="App version">v4.0</div>');
    html=html.replace('</body>','<script src="./omi-classroom.js?v=20260906-2"><\/script><script src="./omi-auto-sync.js?v=20260906-1"><\/script></body>');
    document.open(); document.write(html); document.close();
  }catch(err){
    document.body.innerHTML='<div class="boot"><div class="boot-card"><strong>Tracker failed to load.</strong><pre style="white-space:pre-wrap">'+String(err&&err.message||err).replace(/[&<>]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]})+'</pre></div></div>';
  }
})();
</script>
</body>
</html>
